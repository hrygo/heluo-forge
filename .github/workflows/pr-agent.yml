name: 洛神 (PR-Agent)

# Automated PR review through PR-Agent (https://github.com/The-PR-Agent/pr-agent).
# The Action reads the pull request through the GitHub API and sends only the
# diff, the PR metadata and the declared repo-context files to the model; it
# never checks out or executes PR code, so there is no `actions/checkout` step.
#
# One-time setup per repository:
#   1. Settings > Secrets and variables > Actions > New repository secret:
#      `OPENCODE_GO_API_KEY` = the OpenCode Go subscription key (opencode.ai).
#   2. Merge this workflow and `.pr_agent.toml` to `main`. The Action loads its
#      settings from the PR's base branch, so neither file applies to existing
#      PRs until it reaches `main`.
# Manual commands in a PR comment: `/describe`, `/review`, `/improve`,
# `/ask "<question>"`. Comments are only obeyed from owner, member or
# collaborator accounts.
#
# Fork PRs are skipped on purpose: `pull_request` from a fork receives neither
# repository secrets nor a writable token, and the repository's workflow rules
# forbid running PR-triggered jobs with base-context secrets. Revisiting that
# needs a design decision.

on:
  pull_request:
    # Synchronize is enabled only for the isolated review dismissal probe.
    types: [opened, reopened, ready_for_review, review_requested, synchronize]
  issue_comment:
    types: [created]

# `issues: write` and `pull-requests: write` are the minimum needed to publish
# review comments and labels; everything else stays read-only.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  dismissal-probe:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.number == 218
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Probe dismissal permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pulls/218/reviews/5829369646/dismissals`, {
            method: 'PUT',
            headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'Permission probe: the deliberately introduced test defect has been removed.' }),
          });
          const body = await response.json();
          console.log(`HTTP status: ${response.status}; review state: ${body.state ?? 'unavailable'}`);
          if (!response.ok) process.exitCode = 1;
          NODE

  review:
    name: 洛神 (ubuntu-x64)
    # Skip: bot senders (PR-Agent's own comments would loop), draft PRs (the
    # `ready_for_review` event covers promotion), fork PRs (see header), plain
    # issue comments, and comment commands from accounts without write access.
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request' &&
         github.event.action != 'synchronize' &&
         github.event.pull_request.draft == false &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    concurrency:
      # Upstream skips the initial review_requested event. Keep that no-op and
      # unrelated comments from cancelling an in-progress authorized review.
      group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name == 'issue_comment' && (github.event.sender.type == 'Bot' || !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || !startsWith(github.event.comment.body, '/review')) && 'other-comment' || github.event.action == 'review_requested' && github.event.pull_request.created_at != '' && github.event.pull_request.created_at == github.event.pull_request.updated_at && 'initial-request' || 'review' }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Capture PR revision
        id: revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';

          const { GH_TOKEN, GITHUB_API_URL, GITHUB_OUTPUT, GITHUB_REPOSITORY, PR_NUMBER } = process.env;
          if (!/^[1-9][0-9]*$/.test(PR_NUMBER ?? '')) throw new Error('Invalid PR number');
          const response = await fetch(`${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}`, {
            headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${GH_TOKEN}` },
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`Cannot read PR revision (HTTP ${response.status})`);
          const pr = await response.json();
          const head = pr.head?.sha;
          const base = pr.base?.sha;
          if (![head, base].every((sha) => typeof sha === 'string' && /^[a-f0-9]{40}$/.test(sha))) {
            throw new Error('Invalid PR revision');
          }
          await appendFile(GITHUB_OUTPUT, `head=${head}\nbase=${base}\n`);
          NODE

      - name: Run PR-Agent
        id: pr_agent
        uses: the-pr-agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b # v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OpenCode Go gateway. The endpoint and headers are host-only in
          # PR-Agent, so they belong here and not in `.pr_agent.toml`.
          OPENAI__KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENAI__API_BASE: "https://opencode.ai/inference/go/openai/v1"
          # Go rejects requests without a session header and asks clients to
          # identify themselves instead of using a generic SDK User-Agent.
          LITELLM__EXTRA_HEADERS: '{"x-opencode-session":"pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}","User-Agent":"pr-agent/0.50.0"}'
          # Bootstrap mirror of `.pr_agent.toml` [config]: a run triggered while
          # that file is not yet on the base branch would otherwise fall back to
          # PR-Agent's built-in model, which this gateway does not serve, and the
          # model is absent from both PR-Agent's token table and LiteLLM's
          # metadata, so the token budget must be supplied explicitly or every
          # tool aborts before it calls the model. Environment values take
          # precedence; keep the two in sync when changing either.
          CONFIG__MODEL: "openai/muse-spark-1.3-contributor"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "120000"
          CONFIG__MAX_MODEL_TOKENS: "120000"
          # Expose structured review data and request the same recommendation
          # before the base branch has received the repository settings.
          GITHUB_ACTION_CONFIG__ENABLE_OUTPUT: "true"
          PR_REVIEWER__REQUIRE_MERGE_RECOMMENDATION: "true"
          # Preserve the original PR description before repository settings exist.
          PR_DESCRIPTION__PUBLISH_DESCRIPTION_AS_COMMENT: "true"
          # Describe and review on PR open; code suggestions stay on demand
          # (`/improve`) so a review stays a single LLM call.
          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "false"

      - name: Submit requested changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
          REVIEW_RESULT: ${{ steps.pr_agent.outputs.review }}
          REVIEWED_HEAD: ${{ steps.revision.outputs.head }}
          REVIEWED_BASE: ${{ steps.revision.outputs.base }}
        run: |
          node --input-type=module <<'NODE'
          const { GH_TOKEN, GITHUB_API_URL, GITHUB_REPOSITORY, PR_NUMBER, EVENT_NAME, EVENT_ACTION, COMMENT_BODY,
            PR_TITLE, PR_CREATED_AT, PR_UPDATED_AT, REVIEW_RESULT, REVIEWED_HEAD, REVIEWED_BASE } = process.env;
          if (!REVIEW_RESULT) {
            // Match the upstream default ignored-title rule, initial request
            // deduplication and the no-new-files incremental review skip.
            const ignoredTitle = /^\[Auto\]/.test(PR_TITLE ?? '');
            const initialRequest = EVENT_ACTION === 'review_requested' && PR_CREATED_AT && PR_CREATED_AT === PR_UPDATED_AT;
            const incremental = EVENT_NAME === 'issue_comment' && /^\s*\/review\s+-i(?:\s|$)/i.test(COMMENT_BODY ?? '');
            const expected = !ignoredTitle && ((EVENT_NAME === 'pull_request' && !initialRequest) ||
              (EVENT_NAME === 'issue_comment' && !incremental && /^\s*\/review(?:\s|$)/i.test(COMMENT_BODY ?? '')));
            if (expected) throw new Error('PR-Agent did not produce structured review output');
            if (incremental && !ignoredTitle) {
              console.log('::warning::Incremental review produced no structured output; check whether PR-Agent skipped unchanged files.');
            }
            process.exit(0);
          }
          let review;
          try {
            review = JSON.parse(REVIEW_RESULT);
          } catch {
            throw new Error('PR-Agent review output is not valid JSON');
          }
          const recommendation = typeof review?.merge_recommendation === 'string' ? review.merge_recommendation.trim() : '';
          if (recommendation === 'no_concerns_found' || recommendation === 'needs_review') process.exit(0);
          if (recommendation !== 'changes_required') throw new Error('PR-Agent review recommendation is missing or unknown');
          if (!/^[1-9][0-9]*$/.test(PR_NUMBER ?? '') ||
              ![REVIEWED_HEAD, REVIEWED_BASE].every((sha) => typeof sha === 'string' && /^[a-f0-9]{40}$/.test(sha))) {
            throw new Error('Invalid reviewed PR revision');
          }
          const url = `${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}`;
          const headers = { Accept: 'application/vnd.github+json', Authorization: `Bearer ${GH_TOKEN}` };
          const current = await fetch(url, { headers, signal: AbortSignal.timeout(15000) });
          if (!current.ok) throw new Error(`Cannot verify PR revision (HTTP ${current.status})`);
          const pr = await current.json();
          if (pr.head?.repo?.full_name !== GITHUB_REPOSITORY) {
            console.log('Skipping a fork or deleted head repository');
            process.exit(0);
          }
          if (pr.state !== 'open' || pr.head?.sha !== REVIEWED_HEAD || pr.base?.sha !== REVIEWED_BASE) {
            throw new Error('PR revision changed during review; no request for changes submitted');
          }
          // Preserve the findings in this review even if the persistent agent
          // comment is replaced by a subsequent review. Do not notify users
          // mentioned in model-generated text.
          const clean = (value) => typeof value === 'string'
            ? value.replace(/\s+/gu, ' ').replaceAll('@', '@\u200b').replace(/[<>`]/gu, '').trim().slice(0, 1000) : '';
          const issues = (Array.isArray(review.key_issues_to_review) ? review.key_issues_to_review : []).slice(0, 4)
            .map((issue) => {
              const title = clean(issue?.issue_header) || '问题';
              const file = clean(issue?.relevant_file);
              const line = Number.isSafeInteger(issue?.start_line) && issue.start_line > 0 ? `:${issue.start_line}` : '';
              const detail = clean(issue?.issue_content);
              return `- ${title}${file ? ` (${file}${line})` : ''}${detail ? `: ${detail}` : ''}`;
            });
          const security = clean(review.security_concerns);
          if (security && !/^(no|none)$/i.test(security)) issues.push(`- 安全问题: ${security}`);
          const body = [
            '洛神（PR-Agent）发现合并前必须修复的问题。',
            '',
            ...(issues.length ? issues : ['请参阅 PR-Agent 的审查评论。']),
            '',
            `审查提交: ${REVIEWED_HEAD}`,
            '修复后请运行 `/review`，并由有权限的维护者复核、解除此请求。',
          ].join('\n');
          const response = await fetch(`${url}/reviews`, {
            method: 'POST',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              event: 'REQUEST_CHANGES',
              commit_id: REVIEWED_HEAD,
              body,
            }),
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`Cannot request changes (HTTP ${response.status})`);
          const submitted = await response.json();
          if (submitted.state !== 'CHANGES_REQUESTED' || submitted.commit_id !== REVIEWED_HEAD) {
            throw new Error('GitHub returned an unexpected review state or commit');
          }
          const after = await fetch(url, { headers, signal: AbortSignal.timeout(15000) });
          if (!after.ok) throw new Error(`Review submitted, but PR revision could not be rechecked (HTTP ${after.status})`);
          const latest = await after.json();
          if (latest.state !== 'open' || latest.head?.repo?.full_name !== GITHUB_REPOSITORY ||
              latest.head?.sha !== REVIEWED_HEAD || latest.base?.sha !== REVIEWED_BASE) {
            throw new Error('Review was submitted for an earlier PR revision; manual review or dismissal is required');
          }
          console.log('Requested changes for the reviewed commit');
          NODE
