name: 洛神 (PR-Agent)

# Automated PR review through PR-Agent (https://github.com/The-PR-Agent/pr-agent).
# The Action reads the pull request through the GitHub API and sends only the
# diff, the PR metadata and the declared repo-context files to the model; it
# never checks out or executes PR code, so there is no `actions/checkout` step.
#
# One-time setup per repository:
#   1. Settings > Secrets and variables > Actions > New repository secret:
#      `OPENCODE_GO_API_KEY` = the OpenCode Go subscription key (opencode.ai).
#   2. Merge this workflow and `.pr_agent.toml` to the PR's base branch. The
#      Action loads repository settings from that branch on subsequent runs.
# Manual commands in a PR comment: `/describe`, `/review`, `/improve`,
# `/ask "<question>"`. Comments are only obeyed from owner, member or
# collaborator accounts.
#
# Fork PRs are skipped on purpose: `pull_request` from a fork receives neither
# repository secrets nor a writable token, and the repository's workflow rules
# forbid running PR-triggered jobs with base-context secrets. Revisiting that
# needs a design decision.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize]
  issue_comment:
    types: [created]

# `issues: write` and `pull-requests: write` allow PR-Agent to publish comments.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: 洛神 (ubuntu-x64)
    # Skip bot comments (which could loop), draft and fork PRs, plain issue
    # comments, and comment commands from accounts without write access.
    # A bot push to a same-repository PR is still eligible for a full review.
    if: >-
      (
        (github.event_name == 'issue_comment' &&
         github.event.sender.type != 'Bot' &&
         github.event.issue.pull_request != null &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request' &&
         (github.event.sender.type != 'Bot' || github.event.action == 'synchronize') &&
         github.event.pull_request.draft == false &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    concurrency:
      # All comments containing /review share the review group, even with
      # leading whitespace. Comment events wait; newer PR pushes cancel runs.
      group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name == 'issue_comment' && (github.event.sender.type == 'Bot' || !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || !contains(github.event.comment.body, '/review')) && 'other-comment' || github.event.action == 'review_requested' && github.event.pull_request.created_at != '' && github.event.pull_request.created_at == github.event.pull_request.updated_at && 'initial-request' || 'review' }}
      cancel-in-progress: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Capture PR revision
        id: revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: &capture_revision |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';

          const { GH_TOKEN, GITHUB_API_URL, GITHUB_OUTPUT, GITHUB_REPOSITORY, PR_NUMBER, EXPECTED_HEAD, EXPECTED_BASE_REF } = process.env;
          if (!/^[1-9][0-9]*$/.test(PR_NUMBER ?? '')) throw new Error('Invalid PR number');
          const response = await fetch(`${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}`, {
            headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${GH_TOKEN}` },
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`Cannot read PR revision (HTTP ${response.status})`);
          const pr = await response.json();
          const head = pr.head?.sha;
          const baseRef = pr.base?.ref;
          if (typeof head !== 'string' || !/^[a-f0-9]{40}$/.test(head) ||
              typeof baseRef !== 'string' || !baseRef || /[\u0000-\u0020\u007f]/u.test(baseRef) ||
              pr.base?.repo?.full_name !== GITHUB_REPOSITORY) {
            throw new Error('Invalid PR revision');
          }
          if ((EXPECTED_HEAD && head !== EXPECTED_HEAD) || (EXPECTED_BASE_REF && baseRef !== EXPECTED_BASE_REF)) {
            throw new Error('PR revision changed before retry');
          }
          // The PR's base.sha can remain at the merge base after the target branch advances.
          const baseResponse = await fetch(`${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${encodeURIComponent(baseRef)}`, {
            headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${GH_TOKEN}` },
            signal: AbortSignal.timeout(15000),
          });
          if (!baseResponse.ok) throw new Error(`Cannot read target branch (HTTP ${baseResponse.status})`);
          const reference = await baseResponse.json();
          const base = reference.object?.sha;
          if (reference.ref !== `refs/heads/${baseRef}` || reference.object?.type !== 'commit' ||
              typeof base !== 'string' || !/^[a-f0-9]{40}$/.test(base)) {
            throw new Error('Invalid target branch revision');
          }
          await appendFile(GITHUB_OUTPUT, `head=${head}\nbase=${base}\nbase_ref=${baseRef}\nstarted=${new Date().toISOString()}\n`);
          NODE

      - name: Run PR-Agent
        id: pr_agent
        uses: the-pr-agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b # v0.50.0
        env: &pr_agent_env
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OpenCode Go gateway. The endpoint and headers are host-only in
          # PR-Agent, so they belong here and not in `.pr_agent.toml`.
          OPENAI__KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENAI__API_BASE: "https://opencode.ai/inference/go/openai/v1"
          # Go rejects requests without a session header and asks clients to
          # identify themselves instead of using a generic SDK User-Agent.
          LITELLM__EXTRA_HEADERS: '{"x-opencode-session":"pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}","User-Agent":"pr-agent/0.50.0"}'
          # Bootstrap mirror of `.pr_agent.toml` [config]: a run triggered while
          # that file is not yet on the base branch would otherwise fall back to
          # PR-Agent's built-in model, which this gateway does not serve, and the
          # model is absent from both PR-Agent's token table and LiteLLM's
          # metadata, so the token budget must be supplied explicitly or every
          # tool aborts before it calls the model. Environment values take
          # precedence; keep the two in sync when changing either.
          CONFIG__MODEL: "openai/muse-spark-1.3-contributor"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "120000"
          CONFIG__MAX_MODEL_TOKENS: "120000"
          # Expose structured review data and mirror the repository policy.
          GITHUB_ACTION_CONFIG__ENABLE_OUTPUT: "true"
          PR_REVIEWER__REQUIRE_MERGE_RECOMMENDATION: "true"
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: "true"
          PR_REVIEWER__REQUIRE_TICKET_ANALYSIS_REVIEW: "false"
          PR_REVIEWER__PERSISTENT_COMMENT: "true"
          PR_REVIEWER__PERSISTENT_FINDING_STATE: "false"
          PR_REVIEWER__FINAL_UPDATE_MESSAGE: "false"
          # Refresh the description and review after every eligible push.
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: "true"
          GITHUB_ACTION_CONFIG__PUSH_COMMANDS: '["/describe", "/review"]'
          GITHUB_ACTION_CONFIG__PUSH_TRIGGER_IGNORE_BOT_COMMITS: "false"
          GITHUB_ACTION_CONFIG__PUSH_TRIGGER_IGNORE_MERGE_COMMITS: "false"
          # Preserve the original PR description before repository settings exist.
          PR_DESCRIPTION__PUBLISH_DESCRIPTION_AS_COMMENT: "true"
          PR_DESCRIPTION__PUBLISH_DESCRIPTION_AS_COMMENT_PERSISTENT: "true"
          # Describe and review on PR open; code suggestions stay on demand
          # (`/improve`) so a review stays a single LLM call.
          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "false"

      # The model's review stays advisory. A maintainer decides whether any
      # finding merits a formal request or whether an existing request is resolved.
      - name: Validate PR-Agent review
        id: validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
          REVIEW_RESULT: ${{ steps.pr_agent.outputs.review }}
          REVIEWED_HEAD: ${{ steps.revision.outputs.head }}
          REVIEWED_BASE: ${{ steps.revision.outputs.base }}
          REVIEWED_BASE_REF: ${{ steps.revision.outputs.base_ref }}
          REVIEW_STARTED_AT: ${{ steps.revision.outputs.started }}
          PR_AGENT_ALLOW_RETRY: "true"
        run: &validate_review |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';

          const { GH_TOKEN, GITHUB_API_URL, GITHUB_REPOSITORY, PR_NUMBER, EVENT_NAME, EVENT_ACTION, COMMENT_BODY,
            PR_TITLE, PR_CREATED_AT, PR_UPDATED_AT, REVIEW_RESULT, REVIEWED_HEAD, REVIEWED_BASE, REVIEWED_BASE_REF,
            REVIEW_STARTED_AT, PR_AGENT_ALLOW_RETRY, PR_AGENT_CHECK_REFRESH, GITHUB_OUTPUT } = process.env;
          if (!REVIEW_RESULT) {
            // Match the upstream ignored-title and incremental-review skips.
            const ignoredTitle = /^\[Auto\]/.test(PR_TITLE ?? '');
            const initialRequest = EVENT_ACTION === 'review_requested' && PR_CREATED_AT && PR_CREATED_AT === PR_UPDATED_AT;
            const incremental = EVENT_NAME === 'issue_comment' && /^\s*\/review\s+-i(?:\s|$)/i.test(COMMENT_BODY ?? '');
            const expected = !ignoredTitle && ((EVENT_NAME === 'pull_request' && !initialRequest) ||
              (EVENT_NAME === 'issue_comment' && !incremental && /^\s*\/review(?:\s|$)/i.test(COMMENT_BODY ?? '')));
            if (!expected) {
              if (incremental && !ignoredTitle) {
                console.log('::warning::Incremental review produced no structured output; check whether PR-Agent skipped unchanged files.');
              }
              process.exit(0);
            }
          }
          if (REVIEW_RESULT) {
            let review;
            try {
              review = JSON.parse(REVIEW_RESULT);
            } catch {
              throw new Error('PR-Agent review output is not valid JSON');
            }
            const recommendation = typeof review?.merge_recommendation === 'string' ? review.merge_recommendation.trim() : '';
            if (!['changes_required', 'needs_review', 'no_concerns_found'].includes(recommendation)) {
              throw new Error('PR-Agent review recommendation is missing or unknown');
            }
          }
          if (!/^[1-9][0-9]*$/.test(PR_NUMBER ?? '') ||
              ![REVIEWED_HEAD, REVIEWED_BASE].every((sha) => typeof sha === 'string' && /^[a-f0-9]{40}$/.test(sha)) ||
              typeof REVIEWED_BASE_REF !== 'string' || !REVIEWED_BASE_REF || /[\u0000-\u0020\u007f]/u.test(REVIEWED_BASE_REF)) {
            throw new Error('Invalid reviewed PR revision');
          }
          const url = `${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}`;
          const headers = { Accept: 'application/vnd.github+json', Authorization: `Bearer ${GH_TOKEN}` };
          async function verifyRevision() {
            const response = await fetch(url, { headers, signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error(`Cannot verify PR revision (HTTP ${response.status})`);
            const pr = await response.json();
            if (pr.head?.repo?.full_name !== GITHUB_REPOSITORY) {
              console.log('Skipping a fork or deleted head repository');
              process.exit(0);
            }
            if (pr.state !== 'open' || pr.head?.sha !== REVIEWED_HEAD || pr.base?.ref !== REVIEWED_BASE_REF ||
                pr.base?.repo?.full_name !== GITHUB_REPOSITORY) {
              throw new Error('PR revision changed during review; summary and review may need to be refreshed');
            }
            const baseResponse = await fetch(`${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${encodeURIComponent(REVIEWED_BASE_REF)}`, {
              headers,
              signal: AbortSignal.timeout(15000),
            });
            if (!baseResponse.ok) throw new Error(`Cannot verify target branch (HTTP ${baseResponse.status})`);
            const reference = await baseResponse.json();
            if (reference.ref !== `refs/heads/${REVIEWED_BASE_REF}` || reference.object?.type !== 'commit' ||
                typeof reference.object?.sha !== 'string' || !/^[a-f0-9]{40}$/.test(reference.object.sha)) {
              throw new Error('Invalid target branch revision');
            }
            if (reference.object.sha !== REVIEWED_BASE) {
              if (PR_AGENT_ALLOW_RETRY === 'true') {
                await appendFile(GITHUB_OUTPUT, 'retry=true\n');
                console.log('::warning::Target branch advanced during review; retrying the PR-Agent run.');
                process.exit(0);
              }
              throw new Error('PR revision changed during review; summary and review may need to be refreshed');
            }
            return pr;
          }
          const pr = await verifyRevision();
          if (!REVIEW_RESULT) {
            if (pr.changed_files === 0) {
              const comparisonUrl = `${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/compare/${REVIEWED_BASE}...${REVIEWED_HEAD}?per_page=1`;
              const response = await fetch(comparisonUrl, { headers, signal: AbortSignal.timeout(15000) });
              if (!response.ok) throw new Error(`Cannot verify PR comparison (HTTP ${response.status})`);
              const comparison = await response.json();
              if (comparison.base_commit?.sha !== REVIEWED_BASE || !Array.isArray(comparison.files) ||
                  !['ahead', 'behind', 'diverged', 'identical'].includes(comparison.status)) {
                throw new Error('Invalid PR comparison');
              }
              if (comparison.files.length) throw new Error('PR-Agent did not produce structured review output');
              await verifyRevision();
              console.log('Skipping structured review: the pull request has no changed files.');
              process.exit(0);
            }
            throw new Error('PR-Agent did not produce structured review output');
          }
          if (EVENT_NAME === 'pull_request' && (EVENT_ACTION === 'synchronize' || PR_AGENT_CHECK_REFRESH === 'true')) {
            const started = Date.parse(REVIEW_STARTED_AT ?? '');
            if (!Number.isFinite(started)) throw new Error('Invalid PR-Agent run start time');
            const markers = new Set(['<!-- pr-agent:describe:persistent -->', '<!-- pr-agent:review:full -->']);
            const commentsUrl = `${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments`;
            // GitHub timestamps have second precision, while the captured start has milliseconds.
            const earliest = Math.floor(started / 1000) * 1000;
            for (let page = 1; page <= 100 && markers.size; page++) {
              const commentsResponse = await fetch(`${commentsUrl}?per_page=100&page=${page}`, {
                headers,
                signal: AbortSignal.timeout(15000),
              });
              if (!commentsResponse.ok) throw new Error(`Cannot verify PR-Agent comments (HTTP ${commentsResponse.status})`);
              const comments = await commentsResponse.json();
              if (!Array.isArray(comments)) throw new Error('Invalid PR-Agent comments response');
              for (const comment of comments) {
                if (comment?.user?.login !== 'github-actions[bot]' || typeof comment.body !== 'string' ||
                    !(Date.parse(comment.updated_at) >= earliest)) continue;
                for (const marker of markers) if (comment.body.includes(marker)) markers.delete(marker);
              }
              if (comments.length < 100) break;
            }
            if (markers.size) throw new Error('PR-Agent summary and review were not both refreshed for this run');
            await verifyRevision();
          }
          console.log('PR-Agent review is advisory; formal review decisions require a maintainer.');
          NODE

      # A base-only change does not produce a PR synchronize event. Retry once
      # in the same job so PR-Agent refreshes its persistent comments.
      - name: Capture refreshed PR revision
        id: retry_revision
        if: ${{ steps.validation.outputs.retry == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EXPECTED_HEAD: ${{ steps.revision.outputs.head }}
          EXPECTED_BASE_REF: ${{ steps.revision.outputs.base_ref }}
        run: *capture_revision

      - name: Retry PR-Agent
        id: pr_agent_retry
        if: ${{ steps.validation.outputs.retry == 'true' }}
        uses: the-pr-agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b # v0.50.0
        env: *pr_agent_env

      - name: Validate refreshed PR-Agent review
        if: ${{ steps.validation.outputs.retry == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
          REVIEW_RESULT: ${{ steps.pr_agent_retry.outputs.review }}
          REVIEWED_HEAD: ${{ steps.retry_revision.outputs.head }}
          REVIEWED_BASE: ${{ steps.retry_revision.outputs.base }}
          REVIEWED_BASE_REF: ${{ steps.retry_revision.outputs.base_ref }}
          REVIEW_STARTED_AT: ${{ steps.retry_revision.outputs.started }}
          PR_AGENT_CHECK_REFRESH: "true"
        run: *validate_review
