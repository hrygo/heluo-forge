name: 洛神 (PR-Agent)
run-name: >-
  ${{ (github.event_name == 'push' || github.event_name == 'branch_protection_rule' || github.event_name == 'schedule') && '洛神 · 核对已有批准' ||
  format('洛神 · PR #{0}{1}', github.event.workflow_run.pull_requests[0].number || github.event.issue.number,
    github.event_name == 'workflow_run' && format(' {0}', github.event.workflow_run.head_sha) || '') }}

# The pull-request signal has read-only permissions and uses no credentials.
# The publisher runs from the default branch. It makes no PR checkout and
# consumes no artifacts or caches from the signal that wakes it.
#
# Set the OPENAI_API_KEY Actions secret and PR_AGENT_ENABLED=true to enable.
# GitHub compares strings ignoring case. A skipped job still appears as a
# check with status `skipped`. This workflow is optional for merging.
# Re-enable with `gh variable set PR_AGENT_ENABLED --body true`, or
# disable with `gh variable delete PR_AGENT_ENABLED`.
#
# Authorized comment commands include /describe, /describe_pr, /review,
# /improve and /ask. An explicit maintainer /request-changes command is
# bound to a specific version and does not invoke the model.

on:
  workflow_run:
    workflows: [pr-agent-signal]
    types: [completed]
  issue_comment:
    types: [created]
  push:
    branches: [main]
  branch_protection_rule:
    types: [created, edited, deleted]
  schedule:
    - cron: '17 * * * *'

# Serialize publication and recovery for each PR, including quoted commands.
concurrency:
  group: pr-agent-${{ (github.event_name == 'push' || github.event_name == 'branch_protection_rule' || github.event_name == 'schedule') && 'main-approval-cleanup' || github.event.workflow_run.pull_requests[0].number || github.event.issue.number }}-${{ github.event_name == 'issue_comment' && (github.event.sender.type != 'User' || !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || !contains(github.event.comment.body, '/')) && 'other-comment' || 'review' }}
  queue: max

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: 洛神 (ubuntu-x64)
    if: >-
      vars.PR_AGENT_ENABLED == 'true' &&
      (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.pull_requests[0].number != null) ||
        (github.event_name == 'issue_comment' &&
         github.event.sender.type == 'User' &&
         github.event.issue.pull_request != null &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      approval_revision: ${{ steps.retry_validation.outputs.approval_revision || steps.validation.outputs.approval_revision }}
    env:
      PR_AGENT_AUTO_APPROVE: ${{ vars.PR_AGENT_AUTO_APPROVE == 'true' }}
      PR_AGENT_APPROVAL_CONFIGURED: ${{ vars.PR_AGENT_APPROVAL_APP_CLIENT_ID != '' }}
      # Native OpenAI endpoint with the runner's API key preflight.
      # Mirror the model and budget so runs also work with older base settings.
      # v0.50.0's bundled model table predates GPT-6.2.
      CONFIG__MODEL: "openai/gpt-6.2-sol"
      CONFIG__FALLBACK_MODELS: '[]'
      CONFIG__CUSTOM_MODEL_MAX_TOKENS: "922000"
      CONFIG__ADDITIONAL_REASONING_EFFORT_MODELS: "gpt-6.2-sol"
      CONFIG__NO_TEMPERATURE_MODELS: "gpt-6.2-sol"
      CONFIG__REASONING_EFFORT: "medium"
      CONFIG__MAX_MODEL_TOKENS: "64000"
      CONFIG__MAX_OUTPUT_TOKENS: "12000"
      CONFIG__MAX_COMMITS_TOKENS: "200"
      CONFIG__AI_TIMEOUT: "180"
      CONFIG__NUM_RETRIES: "1"
      CONFIG__RETRY_SAME_MODEL_ON_TIMEOUT: "false"
      CONFIG__OUTPUT_RUN_DETAILS: "true"
      # A partial review can publish successful chunks before propagating exhaustion.
      CONFIG__PROPAGATE_TOOL_ERRORS: "true"
      GITHUB_ACTION_CONFIG__FAIL_ON_TOOL_ERRORS: "true"
      GITHUB_ACTION_CONFIG__ENABLE_OUTPUT: "true"
      # Refresh on eligible pushes. Each tool step selects its own push command.
      GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: "true"
      GITHUB_ACTION_CONFIG__PUSH_TRIGGER_IGNORE_BOT_COMMITS: "false"
      GITHUB_ACTION_CONFIG__PUSH_TRIGGER_IGNORE_MERGE_COMMITS: "false"
      GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
      # The signal outcome and its files are not review evidence.
      ARTIFACTS__ENABLE: "false"
      ARTIFACTS__TARGET_TOOLS: '[]'
      # Keep both automatic and explicit /describe results in a persistent comment.
      PR_DESCRIPTION__PUBLISH_DESCRIPTION_AS_COMMENT: "true"
      PR_DESCRIPTION__PUBLISH_DESCRIPTION_AS_COMMENT_PERSISTENT: "true"
      PR_DESCRIPTION__ENABLE_PR_DIAGRAM: "true"
      PR_DESCRIPTION__MAX_AI_CALLS: "2"
    steps:
      - name: Checkout trusted review code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Capture PR revision
        id: revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: &capture_revision node scripts/pr-agent-workflow.mjs capture

      - name: Run PR-Agent summary
        if: ${{ steps.revision.outputs.head != '' && (github.event_name == 'workflow_run' || steps.revision.outputs.manual_summary == 'true') }}
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe # 0.50.0-github_action
        env: &pr_agent_summary_env
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__KEY: ${{ secrets.OPENAI_API_KEY }}
          # The summary uses the diff and PR description. Review gets the repository policy.
          CONFIG__REASONING_EFFORT: "low"
          CONFIG__MAX_MODEL_TOKENS: "32000"
          CONFIG__MAX_OUTPUT_TOKENS: "6000"
          CONFIG__MAX_COMMITS_TOKENS: "-1"
          CONFIG__REPO_CONTEXT_FILES: '[]'
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "false"
          GITHUB_ACTION_CONFIG__PUSH_COMMANDS: "/describe"

      # The summary step can fail the job without preventing review of the PR.
      - name: Run PR-Agent
        id: pr_agent
        if: ${{ !cancelled() && steps.revision.outcome == 'success' && steps.revision.outputs.head != '' && steps.revision.outputs.manual_summary != 'true' }}
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe # 0.50.0-github_action
        with: &pr_agent_entrypoint
          entrypoint: /app/.venv/bin/python
          args: /github/workspace/scripts/pr-agent-coverage.py
        env: &pr_agent_env
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__PUSH_COMMANDS: "/review"
          PR_REVIEWER__REQUIRE_MERGE_RECOMMENDATION: "true"
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: "true"
          PR_REVIEWER__REQUIRE_PRIORITY_FILES: "true"
          PR_REVIEWER__REQUIRE_TICKET_ANALYSIS_REVIEW: "false"
          # This publisher handles automatic and bare review comments with exact diff sides.
          PR_REVIEWER__INLINE_KEY_ISSUES: ${{ steps.revision.outputs.upstream_inline == 'true' }}
          PR_REVIEWER__PERSISTENT_COMMENT: "true"
          PR_REVIEWER__PERSISTENT_FINDING_STATE: "false"
          PR_REVIEWER__FINAL_UPDATE_MESSAGE: "false"
          PR_REVIEWER__ENABLE_LARGE_PR_CHUNKING: "true"
          PR_REVIEWER__MAX_NUMBER_OF_CALLS: "5"
          PR_REVIEWER__NUM_MAX_FINDINGS: "4"
          PR_REVIEWER__ENABLE_REVIEW_COVERAGE_FOOTER: "true"
          # The pinned runner records hashes of rows in the actual model request.
          PR_AGENT_COVERAGE_INVOCATION: ${{ steps.retry_revision.outputs.head != '' && 'retry' || 'initial' }}
          PR_AGENT_COVERAGE_PATH: ${{ vars.PR_AGENT_AUTO_APPROVE == 'true' && format('/github/workspace/.pr-agent-coverage-{0}-{1}-{2}.json', github.run_id, github.run_attempt, steps.retry_revision.outputs.head != '' && 'retry' || 'initial') || '' }}

      - name: Validate PR-Agent review
        id: validation
        if: ${{ !cancelled() && steps.revision.outputs.head != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.issue.title }}
          REVIEW_RESULT: ${{ steps.pr_agent.outputs.review }}
          PR_AGENT_COVERAGE_INVOCATION: initial
          PR_AGENT_COVERAGE_PATH: .pr-agent-coverage-${{ github.run_id }}-${{ github.run_attempt }}-initial.json
          REVIEWED_HEAD: ${{ steps.revision.outputs.head }}
          REVIEWED_BASE: ${{ steps.revision.outputs.base }}
          REVIEWED_BASE_REF: ${{ steps.revision.outputs.base_ref }}
          REVIEW_STARTED_AT: ${{ steps.revision.outputs.started }}
          PR_AGENT_ALLOW_RETRY: "true"
        run: &validate_review node scripts/pr-agent-workflow.mjs validate

      # A base-only change does not produce a PR synchronize event. Retry once
      # in the same job so PR-Agent refreshes its persistent comments.
      - name: Capture refreshed PR revision
        id: retry_revision
        if: ${{ steps.validation.outputs.retry == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD: ${{ steps.revision.outputs.head }}
          EXPECTED_BASE_REF: ${{ steps.revision.outputs.base_ref }}
        run: *capture_revision

      - name: Retry PR-Agent summary
        if: ${{ github.event_name == 'workflow_run' && steps.retry_revision.outputs.head != '' }}
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe # 0.50.0-github_action
        env: *pr_agent_summary_env

      - name: Retry PR-Agent
        id: pr_agent_retry
        if: ${{ !cancelled() && steps.retry_revision.outcome == 'success' && steps.retry_revision.outputs.head != '' }}
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe # 0.50.0-github_action
        with: *pr_agent_entrypoint
        env: *pr_agent_env

      - name: Validate refreshed PR-Agent review
        id: retry_validation
        if: ${{ steps.validation.outputs.retry == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_RESULT: ${{ steps.pr_agent_retry.outputs.review }}
          PR_AGENT_COVERAGE_INVOCATION: retry
          PR_AGENT_COVERAGE_PATH: .pr-agent-coverage-${{ github.run_id }}-${{ github.run_attempt }}-retry.json
          REVIEWED_HEAD: ${{ steps.retry_revision.outputs.head }}
          REVIEWED_BASE: ${{ steps.retry_revision.outputs.base }}
          REVIEWED_BASE_REF: ${{ steps.retry_revision.outputs.base_ref }}
          REVIEW_STARTED_AT: ${{ steps.retry_revision.outputs.started }}
        run: *validate_review

      - name: Confirm completed automatic review ${{ steps.retry_validation.outputs.review_key || steps.validation.outputs.review_key }}
        if: ${{ github.event_name == 'workflow_run' && (steps.retry_validation.outputs.review_key != '' || (steps.validation.outputs.retry != 'true' && steps.validation.outputs.review_key != '')) }}
        run: echo 'Automatic review completed for the captured revision.'

  approve:
    name: 洛神自动批准 (ubuntu-x64)
    needs: review
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && vars.PR_AGENT_APPROVAL_APP_CLIENT_ID != '' &&
      (github.event_name == 'push' || github.event_name == 'branch_protection_rule' || github.event_name == 'schedule' ||
       (needs.review.result == 'success' && needs.review.outputs.approval_revision != '' &&
       (fromJSON(needs.review.outputs.approval_revision).allowApproval == false ||
        (vars.PR_AGENT_AUTO_APPROVE == 'true' &&
         fromJSON(needs.review.outputs.approval_revision).runAttempt == github.run_attempt))))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: luoshen-approval
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted approval code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Mint the dedicated Luoshen approval token
        if: ${{ needs.review.outputs.approval_revision == '' || fromJSON(needs.review.outputs.approval_revision).runAttempt == github.run_attempt }}
        id: approval_app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.PR_AGENT_APPROVAL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_AGENT_APPROVAL_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-administration: read

      - name: Reconcile or approve the reviewed PR revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AGENT_AUTO_APPROVE: ${{ vars.PR_AGENT_AUTO_APPROVE == 'true' }}
          PR_AGENT_HUMAN_CODEOWNERS: ${{ vars.PR_AGENT_HUMAN_CODEOWNERS }}
          PR_AGENT_APPROVAL_TOKEN: ${{ steps.approval_app.outputs.token }}
          PR_AGENT_APPROVAL_APP_SLUG: ${{ steps.approval_app.outputs.app-slug }}
          PR_AGENT_APPROVAL_EXPECTED_APP_SLUG: ${{ vars.PR_AGENT_APPROVAL_EXPECTED_APP_SLUG }}
          APPROVAL_REVISION: ${{ needs.review.outputs.approval_revision }}
        run: node scripts/pr-agent-workflow.mjs approve
