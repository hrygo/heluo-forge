          HELUO_IAM_CLIENT_ID: ${{ secrets.HELUO_IAM_CLIENT_ID }}
          HELUO_IAM_SCOPES: ${{ secrets.HELUO_IAM_SCOPES }}
          HELUO_IAM_CALLBACK_PORT: ${{ secrets.HELUO_IAM_CALLBACK_PORT }}
          HELUO_IAM_CALLBACK_ADDRESS: ${{ secrets.HELUO_IAM_CALLBACK_ADDRESS }}
          HELUO_IAM_MANAGED_MODELS_BASE_URL: ${{ secrets.HELUO_IAM_MANAGED_MODELS_BASE_URL }}
          HELUO_IAM_DEFAULT_PROVIDER: ${{ secrets.HELUO_IAM_DEFAULT_PROVIDER }}
          HELUO_IAM_ALLOW_INSECURE_HTTP: ${{ secrets.HELUO_IAM_ALLOW_INSECURE_HTTP }}
          HELUO_IAM_CLIENT_AUTH_METHOD: ${{ secrets.HELUO_IAM_CLIENT_AUTH_METHOD }}
          HELUO_IAM_CLIENT_SECRET_REF: ${{ secrets.HELUO_IAM_CLIENT_SECRET_REF }}
