          HELUO_IAM_CLIENT_ID: ${{ secrets.HELUO_IAM_CLIENT_ID }}
          HELUO_IAM_SCOPES: ${{ secrets.HELUO_IAM_SCOPES }}
          HELUO_IAM_CALLBACK_PORT: ${{ secrets.HELUO_IAM_CALLBACK_PORT }}
          HELUO_IAM_CALLBACK_ADDRESS: ${{ secrets.HELUO_IAM_CALLBACK_ADDRESS }}
          HELUO_IAM_MANAGED_MODELS_BASE_URL: ${{ secrets.HELUO_IAM_MANAGED_MODELS_BASE_URL }}
          HELUO_IAM_DEFAULT_PROVIDER: ${{ secrets.HELUO_IAM_DEFAULT_PROVIDER }}
          HELUO_IAM_ALLOW_INSECURE_HTTP: ${{ secrets.HELUO_IAM_ALLOW_INSECURE_HTTP }}
          HELUO_IAM_CLIENT_AUTH_METHOD: ${{ secrets.HELUO_IAM_CLIENT_AUTH_METHOD }}
          HELUO_IAM_CLIENT_SECRET_REF: ${{ secrets.HELUO_IAM_CLIENT_SECRET_REF }}
          HELUO_IAM_CLIENT_SECRET: ${{ secrets.HELUO_IAM_CLIENT_SECRET }}
        run: |
          if [[ -z "$HELUO_PUBLIC_LICENSE" ]]; then
            echo 'HELUO_PUBLIC_LICENSE is not set; the build needs an explicit license decision.' >&2
            exit 1
          fi
          options=()
          if [[ "$WITH_ENGINEERING" == 'true' ]]; then options+=(--with-engineering); fi
          node scripts/build-employee-package.mjs \
            --tag "$GITHUB_REF_NAME" \
            --config-from-env \
            --license "$HELUO_PUBLIC_LICENSE" \
            --output "$RUNNER_TEMP/employee/heluo-forge-employee-assets" \
            --notes "$RUNNER_TEMP/release-notes.md" \
            --json \
            "${options[@]}"
      - name: Stage the desktop payload
        run: |
          node scripts/stage-desktop-payload.mjs \
            --output "$RUNNER_TEMP/staged" \
            --dsh-tgz "$DSH_TGZ" \
            --target linux-arm64 \
            --employee-assets "$RUNNER_TEMP/employee/heluo-forge-employee-assets"
      - name: Stage the bundled runtime
        run: |
          # After the dsh closure: the payload is laid out the way the locked dsh reads it.
          node scripts/stage-primary-runtime.mjs \
            --target linux-arm64 \
            --output "$RUNNER_TEMP/staged/resources" \
            --pnpm-tgz "$PNPM_TGZ" \
            --dsh-modules "$RUNNER_TEMP/staged/resources/dsh/node_modules" \
            --version "$GITHUB_REF_NAME" \
            --record "$RUNNER_TEMP/staged/primary-runtime-record.json"
      - name: Build the Linux deb installer
        run: |
          node scripts/build-desktop-installer.mjs \
            --identity "$RUNNER_TEMP/employee/heluo-forge-employee-assets/branding/app-identity.json" \
            --resources "$RUNNER_TEMP/staged/resources" \
            --version "$GITHUB_REF_NAME" \
            --output "$RUNNER_TEMP/dist" \
            --target linux \
            --arch arm64 \
            --json
          mkdir -p "$RUNNER_TEMP/upload"
          mv "$RUNNER_TEMP/dist/"heluo-forge-enterprise-*.deb "$RUNNER_TEMP/upload/"
      - name: Attach the deb installer to the draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/upload-draft-release.mjs \
            --tag "$GITHUB_REF_NAME" \
            --directory "$RUNNER_TEMP/upload" \
            --repo "$GITHUB_REPOSITORY"
