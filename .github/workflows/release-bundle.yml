            --record "$RUNNER_TEMP/staged/primary-runtime-record.json"
      - name: Build the NSIS installer
        shell: bash
        run: |
          node scripts/build-desktop-installer.mjs \
            --identity "$RUNNER_TEMP/employee/heluo-forge-employee-assets/branding/app-identity.json" \
            --resources "$RUNNER_TEMP/staged/resources" \
            --version "$GITHUB_REF_NAME" \
            --output "$RUNNER_TEMP/dist" \
            --target win \
            --json
          mkdir -p "$RUNNER_TEMP/upload"
          mv "$RUNNER_TEMP/dist/"heluo-forge-enterprise-*-setup-*.exe "$RUNNER_TEMP/upload/"
