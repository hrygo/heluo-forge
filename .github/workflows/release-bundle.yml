name: release-bundle

# Unified build (CORP-DSH-PLAN-026 §4.0).
#
# A v* tag is the only input: the same tagged source produces the enterprise
# plugin, the enterprise configuration and the employee package, which is
# attached to the draft Release of that tag. The draft stays a draft. This
# workflow never publishes a Release and never uploads build output as a
# workflow artifact, because both are public on a public repository; a draft
# Release is visible to collaborators with write access only.
#
# The write grant is deliberate and narrow. scripts/lib/repo-rules.mjs refuses
# this file unless every condition below holds:
#   - triggers: a pushed v* tag, or a manual dispatch on one, and nothing else;
#   - permissions: the single top-level entry `contents: write`, which creating
#     the draft and uploading assets need;
#   - checkout keeps no credential (`persist-credentials: false`), so the token
#     reaches exactly one step, the upload, through GH_TOKEN;
#   - enterprise configuration reaches exactly one step, the build, as
#     environment variables mapped from secrets of the configuration list.
#
# The configuration lives in Environment secrets of the `release-bundle`
# environment rather than in repository secrets: only a job that enters the
# environment can read them, and entering it waits for an approval. Repository
# settings to apply once (repository administrator):
#   - environment `release-bundle`: add the required reviewers;
#   - its deployment branches and tags: restrict to the tag pattern `v*`;
#   - variables: `HELUO_PUBLIC_LICENSE` (the declared license of the build),
#     `HELUO_WITH_ENGINEERING` (`true` to add the engineering extension).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  employee:
    name: employee package (ubuntu-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-bundle
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Refuse anything but a tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != 'tag' ]]; then
            echo 'release-bundle must be dispatched on a tag, not a branch.' >&2
            exit 1
          fi
      - name: Build the employee package
        env:
          HELUO_PUBLIC_LICENSE: ${{ vars.HELUO_PUBLIC_LICENSE }}
          WITH_ENGINEERING: ${{ vars.HELUO_WITH_ENGINEERING == 'true' }}
          HELUO_IAM_AUTH_MODE: ${{ secrets.HELUO_IAM_AUTH_MODE }}
          HELUO_IAM_ISSUER: ${{ secrets.HELUO_IAM_ISSUER }}
          HELUO_IAM_DISCOVERY_URL: ${{ secrets.HELUO_IAM_DISCOVERY_URL }}
          HELUO_IAM_REVOCATION_ENDPOINT: ${{ secrets.HELUO_IAM_REVOCATION_ENDPOINT }}
          HELUO_IAM_CLIENT_ID: ${{ secrets.HELUO_IAM_CLIENT_ID }}
          HELUO_IAM_SCOPES: ${{ secrets.HELUO_IAM_SCOPES }}
          HELUO_IAM_CALLBACK_PORT: ${{ secrets.HELUO_IAM_CALLBACK_PORT }}
          HELUO_IAM_CALLBACK_ADDRESS: ${{ secrets.HELUO_IAM_CALLBACK_ADDRESS }}
          HELUO_IAM_MANAGED_MODELS_BASE_URL: ${{ secrets.HELUO_IAM_MANAGED_MODELS_BASE_URL }}
          HELUO_IAM_DEFAULT_PROVIDER: ${{ secrets.HELUO_IAM_DEFAULT_PROVIDER }}
          HELUO_IAM_ALLOW_INSECURE_HTTP: ${{ secrets.HELUO_IAM_ALLOW_INSECURE_HTTP }}
          HELUO_IAM_CLIENT_AUTH_METHOD: ${{ secrets.HELUO_IAM_CLIENT_AUTH_METHOD }}
          HELUO_IAM_CLIENT_SECRET_REF: ${{ secrets.HELUO_IAM_CLIENT_SECRET_REF }}
          HELUO_IAM_CLIENT_SECRET: ${{ secrets.HELUO_IAM_CLIENT_SECRET }}
        run: |
          if [[ -z "$HELUO_PUBLIC_LICENSE" ]]; then
            echo 'HELUO_PUBLIC_LICENSE is not set; the build needs an explicit license decision.' >&2
            exit 1
          fi
          options=()
          if [[ "$WITH_ENGINEERING" == 'true' ]]; then options+=(--with-engineering); fi
          node scripts/build-employee-package.mjs \
            --tag "$GITHUB_REF_NAME" \
            --config-from-env \
            --license "$HELUO_PUBLIC_LICENSE" \
            --output "$RUNNER_TEMP/employee/heluo-forge-employee-assets" \
            --notes "$RUNNER_TEMP/release-notes.md" \
            --json \
            "${options[@]}"
          # Only the archive is an asset: the Release body comes from the notes file.
          mkdir -p "$RUNNER_TEMP/upload"
          mv "$RUNNER_TEMP/employee/heluo-forge-employee-assets.zip" "$RUNNER_TEMP/upload/"
      - name: Attach the package to the draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/upload-draft-release.mjs \
            --tag "$GITHUB_REF_NAME" \
            --directory "$RUNNER_TEMP/upload" \
            --repo "$GITHUB_REPOSITORY" \
            --notes "$RUNNER_TEMP/release-notes.md"

  # The desktop lanes rebuild the employee package themselves: workflow
  # artifacts are downloadable by any reader of a public repository, so the
  # enterprise payload travels between jobs only inside the build directory.
  # `needs` keeps the ubuntu lane first, so the draft Release and its notes
  # exist before the desktop assets attach.
  desktop-mac:
    name: desktop installer (macos-arm64)
    needs: employee
    runs-on: macos-15
    timeout-minutes: 45
    environment: release-bundle
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Refuse anything but a tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != 'tag' ]]; then
            echo 'release-bundle must be dispatched on a tag, not a branch.' >&2
            exit 1
          fi
      - name: Install the pinned build toolchain
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Verify the pinned runtime lock against upstream
        run: node scripts/stage-primary-runtime.mjs --verify-lock
      - name: Fetch the locked runtime artifacts
        run: |
          DSH_VERSION=$(node -p "require('./services/forge-desktop/runtime-lock.json').dsh.version")
          npm pack "@deepseek-ai/dsh@${DSH_VERSION}" --pack-destination "$RUNNER_TEMP"
          echo "DSH_TGZ=$(ls "$RUNNER_TEMP"/deepseek-ai-dsh-*.tgz | head -1)" >> "$GITHUB_ENV"
          PNPM_VERSION=$(node -p "require('./services/forge-desktop/runtime-lock.json').pnpm.version")
          npm pack "pnpm@${PNPM_VERSION}" --pack-destination "$RUNNER_TEMP"
          echo "PNPM_TGZ=$(ls "$RUNNER_TEMP"/pnpm-*.tgz | head -1)" >> "$GITHUB_ENV"
      - name: Build the employee package for embedding
        env:
          HELUO_PUBLIC_LICENSE: ${{ vars.HELUO_PUBLIC_LICENSE }}
          WITH_ENGINEERING: ${{ vars.HELUO_WITH_ENGINEERING == 'true' }}
          HELUO_IAM_AUTH_MODE: ${{ secrets.HELUO_IAM_AUTH_MODE }}
          HELUO_IAM_ISSUER: ${{ secrets.HELUO_IAM_ISSUER }}
          HELUO_IAM_DISCOVERY_URL: ${{ secrets.HELUO_IAM_DISCOVERY_URL }}
          HELUO_IAM_REVOCATION_ENDPOINT: ${{ secrets.HELUO_IAM_REVOCATION_ENDPOINT }}
          HELUO_IAM_CLIENT_ID: ${{ secrets.HELUO_IAM_CLIENT_ID }}
          HELUO_IAM_SCOPES: ${{ secrets.HELUO_IAM_SCOPES }}
          HELUO_IAM_CALLBACK_PORT: ${{ secrets.HELUO_IAM_CALLBACK_PORT }}
          HELUO_IAM_CALLBACK_ADDRESS: ${{ secrets.HELUO_IAM_CALLBACK_ADDRESS }}
          HELUO_IAM_MANAGED_MODELS_BASE_URL: ${{ secrets.HELUO_IAM_MANAGED_MODELS_BASE_URL }}
          HELUO_IAM_DEFAULT_PROVIDER: ${{ secrets.HELUO_IAM_DEFAULT_PROVIDER }}
          HELUO_IAM_ALLOW_INSECURE_HTTP: ${{ secrets.HELUO_IAM_ALLOW_INSECURE_HTTP }}
          HELUO_IAM_CLIENT_AUTH_METHOD: ${{ secrets.HELUO_IAM_CLIENT_AUTH_METHOD }}
          HELUO_IAM_CLIENT_SECRET_REF: ${{ secrets.HELUO_IAM_CLIENT_SECRET_REF }}
          HELUO_IAM_CLIENT_SECRET: ${{ secrets.HELUO_IAM_CLIENT_SECRET }}
        run: |
          if [[ -z "$HELUO_PUBLIC_LICENSE" ]]; then
            echo 'HELUO_PUBLIC_LICENSE is not set; the build needs an explicit license decision.' >&2
            exit 1
          fi
          options=()
          if [[ "$WITH_ENGINEERING" == 'true' ]]; then options+=(--with-engineering); fi
          node scripts/build-employee-package.mjs \
            --tag "$GITHUB_REF_NAME" \
            --config-from-env \
            --license "$HELUO_PUBLIC_LICENSE" \
            --output "$RUNNER_TEMP/employee/heluo-forge-employee-assets" \
            --notes "$RUNNER_TEMP/release-notes.md" \
            --json \
            "${options[@]}"
      - name: Stage the desktop payload
        run: |
          node scripts/stage-desktop-payload.mjs \
            --output "$RUNNER_TEMP/staged" \
            --dsh-tgz "$DSH_TGZ" \
            --target mac-arm64 \
            --employee-assets "$RUNNER_TEMP/employee/heluo-forge-employee-assets"
      - name: Stage the bundled runtime
        run: |
          # After the dsh closure: the payload is laid out the way the locked dsh reads it.
          node scripts/stage-primary-runtime.mjs \
            --target mac-arm64 \
            --output "$RUNNER_TEMP/staged/resources" \
            --pnpm-tgz "$PNPM_TGZ" \
            --dsh-modules "$RUNNER_TEMP/staged/resources/dsh/node_modules" \
            --version "$GITHUB_REF_NAME" \
            --record "$RUNNER_TEMP/staged/primary-runtime-record.json"
      - name: Build the desktop application bundle
        run: |
          node scripts/build-desktop-installer.mjs \
            --identity "$RUNNER_TEMP/employee/heluo-forge-employee-assets/branding/app-identity.json" \
            --resources "$RUNNER_TEMP/staged/resources" \
            --version "$GITHUB_REF_NAME" \
            --output "$RUNNER_TEMP/dist" \
            --target mac \
            --arch arm64 \
            --json
          mkdir -p "$RUNNER_TEMP/upload"
          mv "$RUNNER_TEMP/dist/"heluo-forge-enterprise-*-arm64.dmg "$RUNNER_TEMP/upload/"
      - name: Attach the desktop bundle to the draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/upload-draft-release.mjs \
            --tag "$GITHUB_REF_NAME" \
            --directory "$RUNNER_TEMP/upload" \
            --repo "$GITHUB_REPOSITORY"

