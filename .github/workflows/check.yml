name: check

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # All checks currently use Node built-ins; avoid dependency installation and cache overhead.
      - name: Check documents, repository and tests
        run: node --run check

  # Real hosts for every delivered platform-arch. The unit matrix injects the
  # native module so it can run on one host; this job proves the same read
  # paths on each actual OS/arch pair, including the macOS encrypted store.
  device-matrix:
    name: device ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, platform: linux, arch: x64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { name: win32-x64, os: windows-2022, platform: win32, arch: x64 }
          - { name: win32-arm64, os: windows-11-arm, platform: win32, arch: arm64 }
          - { name: darwin-arm64, os: macos-26, platform: darwin, arch: arm64 }
          - { name: darwin-x64, os: macos-26-intel, platform: darwin, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Assert the runner is the expected platform-arch
        run: >-
          node -e "const [p,a]=process.argv.slice(1);
          if (process.platform!==p||process.arch!==a)
          { console.error('expected',p,a,'got',process.platform,process.arch); process.exit(1); }"
          ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Keychain backends on this host
        run: node --test packages/forge-credentials-keychain/test/*.test.mjs
      - name: Read paths on this host
        run: node --test packages/forge-iam/test/read-paths-matrix.test.mjs packages/forge-iam/test/cli-session.test.mjs

  # Local hook and scanner portability. This job is intentionally separate from
  # the required verify job; make it required only after the matrix is stable.
  # The matrix keeps only the platforms whose code paths differ: Ubuntu covers
  # the POSIX branches, Windows covers the win32 branches (8.3 aliases, `icase`
  # pathspecs, backslash normalisation). macOS ran the same POSIX branches with
  # the same skips as Ubuntu, so it added no coverage while being the least
  # reliably provisioned runner.
  sensitive-scan:
    name: sensitive-scan (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Run portable sensitive-scan tests
        run: node --test tests/sensitive-scan.test.mjs tests/sensitive-scan-team.test.mjs tests/sensitive-scan-full-distribution.test.mjs tests/sensitive-scan-parent-tree.test.mjs tests/sensitive-scan-legacy-install.test.mjs tests/sensitive-scan-managed-upgrade.test.mjs tests/sensitive-scan-windows-paths.test.mjs tests/sensitive-scan-post-rewrite.test.mjs tests/sensitive-scan-server-merge.test.mjs tests/sensitive-scan-pre-push.test.mjs

  # The loopback callback listener is the only code here that depends on socket
  # semantics, and those differ between POSIX and Windows (address-family
  # availability, port reuse and shutdown). This job runs just that test file on
  # Windows; the full suite stays on the required verify job.
  forge-iam-callback:
    name: forge-iam callback (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Run loopback callback tests
        run: node --test packages/forge-iam/test/callback-port.test.mjs
