name: repository checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel stale PR runs, but never cancel a main-branch run mid-flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Platform check names describe the SQLite and IAM tests run by their steps.
# Branch protection must use the corresponding names.
jobs:
  changes:
    name: classify changes (ubuntu-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_platforms: ${{ steps.classify.outputs.run_platforms || steps.full.outputs.run_platforms }}
    steps:
      - name: Run all platforms for non-PR events
        id: full
        if: github.event_name != 'pull_request'
        run: echo 'run_platforms=true' >> "$GITHUB_OUTPUT"
      - name: Checkout complete history for the change comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          show-progress: false
      - name: Set up Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Classify changed paths
        id: classify
        if: github.event_name == 'pull_request'
        run: node scripts/ci-classify-changes.mjs
      - name: Validate platform decision
        env:
          RUN_PLATFORMS: ${{ steps.classify.outputs.run_platforms || steps.full.outputs.run_platforms }}
        run: |
          case "$RUN_PLATFORMS" in
            true|false) ;;
            *) echo 'Invalid platform decision.' >&2; exit 1 ;;
          esac

  verify:
    name: verify (ubuntu-x64)
    needs: changes
    # A failed classification must fail this required check, not turn it into
    # a successful skipped job. Cancellation must still stop the workflow.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate change classification
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          RUN_PLATFORMS: ${{ needs.changes.outputs.run_platforms }}
        run: |
          if [[ "$CLASSIFICATION_RESULT" != 'success' ]] || [[ "$RUN_PLATFORMS" != 'true' && "$RUN_PLATFORMS" != 'false' ]]; then
            echo 'Change classification failed or produced an invalid result.' >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # All checks currently use Node built-ins; avoid dependency installation and cache overhead.
      - name: Check PR issue reference
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pr-issue.mjs
      - name: Check documents, repository and tests
        run: node --run check

  # Fixed jobs preserve each platform check name when a job is skipped. A job
  # condition on the whole matrix is evaluated before the matrix is expanded.
  # Configure required contexts in branch protection to match these names.
  native-linux-x64:
    name: SQLite and IAM (linux-x64, ubuntu-24.04)
    needs: changes
    if: &run_platforms ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_platforms != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORGE_CI_PLATFORM: linux
      FORGE_CI_ARCH: x64
    defaults: &bash_defaults
      run:
        shell: bash
    steps: &native_steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Link workspace packages
        run: node scripts/link-workspace.mjs
      - name: Assert the runner is the expected platform-arch
        run: >-
          node -e "const [p,a]=process.argv.slice(1);
          if (process.platform!==p||process.arch!==a)
          { console.error('expected',p,a,'got',process.platform,process.arch); process.exit(1); }"
          "$FORGE_CI_PLATFORM" "$FORGE_CI_ARCH"
      - name: Test credential storage
        run: node --test packages/forge-credentials-keychain/test/*.test.mjs
      - name: Test IAM read paths and CLI bridge
        run: node --test packages/forge-iam/test/read-paths-matrix.test.mjs packages/forge-iam/test/cli-session.test.mjs packages/forge-iam/test/bridge-real-provider.test.mjs packages/forge-iam/test/cli-reader.test.mjs
      # The release closure requires POSIX mode bits on bin entry points, which a
      # Windows checkout cannot carry; Windows packs the credentials package
      # directly for the offline installation check.
      - name: Build the release artifact and verify its bytes
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p node_modules/.forge-ci
          rm -rf node_modules/.forge-ci/bundle
          node scripts/build-enterprise-bundle.mjs node_modules/.forge-ci/bundle > node_modules/.forge-ci/build.json
          node scripts/verify-enterprise-bundle.mjs node_modules/.forge-ci/bundle/*.tgz \
            --manifest node_modules/.forge-ci/bundle/bundle-manifest.json --json > node_modules/.forge-ci/verify.json
          node -e "const v=require('./node_modules/.forge-ci/verify.json'); if(v.ok!==true){console.error(v.errors.join('\n')); process.exit(1)} console.log('artifact:', v.files, 'files,', v.bytes, 'bytes,', v.sha256)"
      - name: Pack the credentials package
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          mkdir -p node_modules/.forge-ci/bundle
          rm -f node_modules/.forge-ci/bundle/*.tgz
          node --input-type=module -e "import { execNpm } from './scripts/lib/bundle-rules.mjs'; execNpm(['pack', './packages/forge-credentials-keychain', '--ignore-scripts', '--pack-destination', 'node_modules/.forge-ci/bundle'], { stdio: 'inherit' });"
      - name: Install and test the artifact offline
        run: |
          set -euo pipefail
          rm -rf node_modules/.forge-ci/install
          mkdir -p node_modules/.forge-ci/install
          node --input-type=module -e "import { execNpm } from './scripts/lib/bundle-rules.mjs'; execNpm(['install', '--offline', '--ignore-scripts', '--no-audit', '--no-fund', '--prefix', 'node_modules/.forge-ci/install', ...process.argv.slice(1)], { stdio: 'inherit' });" node_modules/.forge-ci/bundle/*.tgz
          if [ -d node_modules/.forge-ci/install/node_modules/@heluo/forge-enterprise ]; then
            PACKAGE=node_modules/.forge-ci/install/node_modules/@heluo/forge-enterprise/node_modules/@heluo/forge-credentials-keychain
          else
            PACKAGE=node_modules/.forge-ci/install/node_modules/@heluo/forge-credentials-keychain
          fi
          node scripts/probe/installed-credential-smoke.mjs "$PACKAGE"

  native-linux-arm64:
    name: SQLite and IAM (linux-arm64, ubuntu-24.04-arm)
    needs: changes
    if: *run_platforms
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      FORGE_CI_PLATFORM: linux
      FORGE_CI_ARCH: arm64
    defaults: *bash_defaults
    steps: *native_steps

  native-win32-x64:
    name: SQLite and IAM (win32-x64, windows-2022)
    needs: changes
    if: *run_platforms
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      FORGE_CI_PLATFORM: win32
      FORGE_CI_ARCH: x64
    defaults: *bash_defaults
    steps: *native_steps

  native-win32-arm64:
    name: SQLite and IAM (win32-arm64, windows-11-arm)
    needs: changes
    if: *run_platforms
    runs-on: windows-11-arm
    timeout-minutes: 15
    env:
      FORGE_CI_PLATFORM: win32
      FORGE_CI_ARCH: arm64
    defaults: *bash_defaults
    steps: *native_steps

  # Forward-compatibility jobs are not required checks.
  native-linux-x64-next:
    name: SQLite and IAM (linux-x64, ubuntu-26.04)
    needs: changes
    if: *run_platforms
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      FORGE_CI_PLATFORM: linux
      FORGE_CI_ARCH: x64
    defaults: *bash_defaults
    steps: *native_steps

  native-win32-x64-next:
    name: SQLite and IAM (win32-x64, windows-2025)
    needs: changes
    if: *run_platforms
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      FORGE_CI_PLATFORM: win32
      FORGE_CI_ARCH: x64
    defaults: *bash_defaults
    steps: *native_steps

  # The same synthetic SQLite and IAM tests run on each supported OS.
  document-macos-15:
    name: SQLite and IAM (darwin-arm64, macos-15)
    needs: changes
    if: *run_platforms
    runs-on: macos-15
    timeout-minutes: 10
    env:
      FORGE_CI_PLATFORM: darwin
      FORGE_CI_ARCH: arm64
    defaults: *bash_defaults
    steps: *native_steps

  document-macos-15-intel:
    name: SQLite and IAM (darwin-x64, macos-15-intel)
    needs: changes
    if: *run_platforms
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      FORGE_CI_PLATFORM: darwin
      FORGE_CI_ARCH: x64
    defaults: *bash_defaults
    steps: *native_steps
  # Windows-specific scanner and socket behavior: verify already runs these
  # suites on Ubuntu. Keep this job non-required and run all files together so
  # a failure in one suite does not prevent the other from executing.
  sensitive-scan:
    name: sensitive scan and IAM callback (win32-x64)
    needs: changes
    if: *run_platforms
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Test Windows sensitive scan and IAM callback
        run: node --test tests/sensitive-scan.test.mjs tests/sensitive-scan-team.test.mjs tests/sensitive-scan-full-distribution.test.mjs tests/sensitive-scan-parent-tree.test.mjs tests/sensitive-scan-legacy-install.test.mjs tests/sensitive-scan-managed-upgrade.test.mjs tests/sensitive-scan-windows-paths.test.mjs tests/sensitive-scan-post-rewrite.test.mjs tests/sensitive-scan-server-merge.test.mjs tests/sensitive-scan-pre-push.test.mjs packages/forge-iam/test/callback-port.test.mjs
