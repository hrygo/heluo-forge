# pull_request_target is required here: the workflow definition must come from the
# base branch, otherwise a pull request could weaken the gate that verifies it.
# That event is blocked for public repositories by a GitHub default policy
# (enforced 2026-12-02) unless a repository Actions policy allows it, so this
# workflow depends on the repo policy "sensitive-attestation needs
# pull_request_target" (Settings -> Actions -> Policies). Recreate that policy
# if the repository is ever re-created; without it these checks stop running.
name: sensitive-attestation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Keeps its historical context name on purpose: `pull_request_target` loads
  # this workflow from the base branch, so a rename only takes effect after the
  # rename lands — while branch protection would immediately look for a context
  # nothing reports. Renaming therefore needs two steps: merge the rename with
  # this name still required, then switch the required context.
  sensitive-attestation-verify:
    name: sensitive-attestation-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout base revision only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # Base-only checkout; the verifier reads git objects and never executes PR code.
          persist-credentials: true
          fetch-depth: 0
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify PR issue reference using base code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pr-issue.mjs
      - name: Verify local attestations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          HEAD_SHA="$(git rev-parse refs/remotes/pull/head)"
          if [ "$HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo 'PR head changed during verification; retry the check.' >&2
            exit 1
          fi
          if node scripts/sensitive-scan/verify.mjs --base "${BASE_SHA}" --head "${EXPECTED_HEAD_SHA}"; then
            exit 0
          fi
          # The verifier names each rejected commit and its reason. Print the local
          # steps that repair the branch: a merge commit, a replayed commit and an
          # unsigned commit all recover through the same rebase, so one block covers
          # every attestation failure instead of only the merge case.
          recovery="$(cat <<'EOF'
          sensitive-attestation failed. If a commit was rejected, repair the branch locally:

            git fetch origin
            git rebase origin/main
            git log --merges --oneline origin/main..HEAD    # must print nothing
            node scripts/sensitive-scan/verify.mjs --base origin/main --head HEAD
            git push --force-with-lease

          Do not use the GitHub web "Update branch" or "Update with rebase": both
          rewrite commits on the server, where the local hooks cannot re-sign them.
          Confirm the worktree is clean and that no other session rewrites this
          branch before force-pushing; --force-with-lease refuses a remote tip that
          moved after the fetch. Re-run pnpm check after resolving conflicts:
          re-signing does not resolve content conflicts.
          Details: scripts/sensitive-scan/README.md#updating-a-pull-request-branch
          EOF
          )"
          printf '%s\n' "$recovery" >&2
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '```\n%s\n```\n' "$recovery" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
        # Install the team public key in the base branch before requiring this check.
        # Missing or invalid public keys fail closed; no PR code is executed.
