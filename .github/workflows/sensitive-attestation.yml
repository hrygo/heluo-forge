name: sensitive-attestation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sensitive-attestation-verify:
    name: sensitive-attestation-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout base revision only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # Base-only checkout; the verifier reads git objects and never executes PR code.
          persist-credentials: true
          fetch-depth: 0
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify local attestations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          HEAD_SHA="$(git rev-parse refs/remotes/pull/head)"
          if [ "$HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo 'PR head changed during verification; retry the check.' >&2
            exit 1
          fi
          node scripts/sensitive-scan/verify.mjs --base "${BASE_SHA}" --head "${EXPECTED_HEAD_SHA}"
        # Install the team public key in the base branch before requiring this check.
        # Missing or invalid public keys fail closed; no PR code is executed.
