name: Delegra expert images

on:
  pull_request:
    branches: [main]
    paths: &image_paths
      - .github/workflows/delegra-expert-images.yml
      - .node-version
      - deploy/delegra-expert-images/**
      - '!deploy/delegra-expert-images/README.md'
      - tests/runner-e2e/expert-runtime-*.mjs
      - tests/runner-e2e/fixtures/expert-runtime/**
  push:
    branches: [main]
    tags: ['expert-images-v*']
    paths: *image_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expert-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  plan:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout event revision and main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - &node
        name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select batches and validate the release ref
        id: plan
        run: node deploy/delegra-expert-images/ci.mjs plan

  verify:
    name: Verify (${{ matrix.batch }}, arm64)
    needs: plan
    if: github.ref_type != 'tag' && needs.plan.outputs.version == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy: &batches
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE_TARGETS: ${{ join(matrix.targets, ' ') }}
    steps:
      - &checkout
        name: Checkout the planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}
      - *node
      - &arm64
        name: Check the native architecture
        run: test "$(uname -m)" = aarch64
      - &buildx
        name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver: docker-container
          driver-opts: image=moby/buildkit@sha256:92f93f25966c544549b88144406ce8cd9dcdf5df128250711031a4acd9149a8e
      - &bake_settings
        name: Prepare Bake settings
        id: settings
        run: node deploy/delegra-expert-images/ci.mjs overrides
      - name: Build and load the batch
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: deploy/delegra-expert-images/buildx-bake.hcl
          targets: ${{ join(matrix.targets, ',') }}
          set: ${{ steps.settings.outputs.settings }}
          load: true
          provenance: false
      - &browser_profile
        name: Fetch and check the Playwright sandbox profile
        if: matrix.batch == 'browser'
        shell: bash
        run: |
          profile="$RUNNER_TEMP/playwright-seccomp.json"
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/microsoft/playwright/v1.65.1/utils/docker/seccomp_profile.json \
            --output "$profile"
          printf '%s  %s\n' cc3e61cabda6bbc1e53e54d27ba4d55a9d3be829b6dd1a596f4a7b31b1cc7849 "$profile" | sha256sum --check --status
          printf 'EXPERT_BROWSER_SECCOMP=%s\n' "$profile" >> "$GITHUB_ENV"
      - name: Run the offline image smoke tests
        run: node deploy/delegra-expert-images/ci.mjs smoke

  candidates:
    name: Stage and verify (${{ matrix.batch }}, arm64)
    needs: plan
    if: github.ref_type == 'tag' && needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy: *batches
    env:
      IMAGE_TARGETS: ${{ join(matrix.targets, ' ') }}
      EXPERT_IMAGE_COMMIT: ${{ needs.plan.outputs.commit }}
      EXPERT_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - *checkout
      - *node
      - *arm64
      - *buildx
      - *bake_settings
      - &registry_login
        name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Stage OCI indexes by digest
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          BUILDX_METADATA_PROVENANCE: disabled
        with:
          source: .
          files: deploy/delegra-expert-images/buildx-bake.hcl
          targets: ${{ join(matrix.targets, ',') }}
          set: ${{ steps.settings.outputs.settings }}
          sbom: true
          provenance: mode=min,version=v1
      - *browser_profile
      - name: Validate registry manifests and smoke-test the pulled digests
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
          IMAGE_BATCH: ${{ matrix.batch }}
        run: node deploy/delegra-expert-images/ci.mjs receipt "$RUNNER_TEMP/$IMAGE_BATCH.json"
      - name: Upload tested digest receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expert-image-candidates-${{ matrix.batch }}
          path: ${{ runner.temp }}/${{ matrix.batch }}.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Publish the tested version
    needs: [plan, candidates]
    if: github.ref_type == 'tag' && needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      EXPERT_IMAGE_COMMIT: ${{ needs.plan.outputs.commit }}
      EXPERT_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - *checkout
      - *node
      - name: Download tested digest receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: expert-image-candidates-*
          path: ${{ runner.temp }}/expert-candidates
          merge-multiple: true
      - name: Assemble the complete release record
        run: >-
          node deploy/delegra-expert-images/ci.mjs assemble
          "$RUNNER_TEMP/expert-candidates" "$RUNNER_TEMP/expert-images-release.json"
      - name: Attest the release record
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/expert-images-release.json
      - *registry_login
      - name: Publish and verify the version tags
        run: node deploy/delegra-expert-images/ci.mjs publish "$RUNNER_TEMP/expert-images-release.json"
      - name: Upload the signed release record and attestation bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expert-images-release-${{ needs.plan.outputs.version }}
          path: |
            ${{ runner.temp }}/expert-images-release.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
          overwrite: true
