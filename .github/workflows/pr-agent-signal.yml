name: pr-agent-signal

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited]

permissions:
  contents: read

jobs:
  signal:
    if: >-
      vars.PR_AGENT_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (github.event.sender.type != 'Bot' || github.event.action == 'synchronize') &&
      (github.event.action != 'synchronize' || !github.event.before || github.event.before != github.event.after) &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo 'PR review signal ready.'
