name: cli-contract

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.0'
          cache: false
      # Node built-ins plus Go stdlib only; no dependency installation, no secrets,
      # no enterprise network. The native fixture is an explicitly synthetic offline
      # contract double and never stands in for Kylin/enterprise IAM evidence.
      - name: Run fixed-argv runner and reader unit tests
        run: node --test packages/forge-devops/test/dop-process.test.mjs packages/forge-devops/test/gh-process.test.mjs packages/forge-devops/test/host-readers.test.mjs packages/forge-devops/test/read.test.mjs packages/forge-devops/test/tools.test.mjs packages/forge-devops/test/change-briefing.test.mjs packages/forge-devops/test/policy-binding.test.mjs
      - name: Build synthetic fixture and run native contract spec
        run: node --test tests/native-cli-mock.spec.mjs
