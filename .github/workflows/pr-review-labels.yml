name: PR review label synchronization

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-label-synchronization
  cancel-in-progress: false

jobs:
  synchronize:
    # Manual dispatch must also execute trusted default-branch code only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Synchronize review labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/pr-review-labels.mjs
