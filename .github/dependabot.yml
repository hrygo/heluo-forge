version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
