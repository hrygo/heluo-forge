packages:
  - packages/*
  - services/*

# @electron/rebuild 引用 electron 的 node-gyp 分叉时使用 git 引用，pnpm 11 的
# blockExoticSubdeps 默认拒绝 git 型子依赖；分叉在 npm 同名发布，钉回注册表。
overrides:
  '@electron/node-gyp': npm:@electron/node-gyp@10.2.0-electron.2

# electron 的 postinstall 下载平台二进制；只有构建期工具需要执行安装脚本。
# electron-winstaller（Squirrel.Windows 工具，随 electron-builder 进树）的脚本
# 显式声明忽略：NSIS 目标用不到它，pnpm 在 CI 会把未声明的被忽略脚本当错误。
onlyBuiltDependencies:
  - electron
# pnpm 11 在 CI 默认严格：任何脚本未被显式分类即失败。桌面工具链里
# electron-winstaller（Squirrel.Windows）用不到，声明忽略并放宽严格位。
strictDepBuilds: false
ignoredBuiltDependencies:
  - electron-winstaller
