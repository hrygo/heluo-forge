# Isolated local verification only. No production endpoints or credentials.
#
# `disabled: true` below closes DSH plugin instances and their provider routes;
# it neither uninstalls `@deepseek-ai/dsh-llm-pi-ai` nor blocks network access.
# IAM managed models still load that package's PiAiAdapter at runtime, and an
# empty `config: {}` plus isolated memory credentials is not evidence of a
# production-ready login. See README.md「补注：禁用插件与网关访问」.
# Invoke with a fresh, explicitly isolated DSH_HOME and the shipped web profile.
- id: deepseek-account
  disabled: true
- id: ui-settings-account
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  disabled: true
- id: ui-settings-models
  disabled: true
- id: credentials
  disabled: true
- insert:
    - id: review-memory-credentials
      name: '../../../scripts/probe/iam-review-memory-credentials.mjs'
    - id: review-heluo-iam
      name: '../../../packages/forge-iam/src/index.mjs'
      inject:
        - connection
      config: {}
    - id: review-enterprise-settings-demo
      name: '../index.js'
