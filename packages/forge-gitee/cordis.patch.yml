# @heluo/forge-gitee 的补丁层（ADR-0012 单安装单元）。
#
# 本文件只做一件事：把 gitee 插件挂载所需的最小配置插进 profile，使"只装 gitee 一个包"也能
# 挂载并直接用于只读查询。两行的顺序即加载顺序，策略必须先行。
#   1. `heluo-policy`：gitee 的策略门禁是硬依赖。`policy` 服务缺失、或三条 `gitee.*` 只读动作
#      未登记/未启用时，`apply()` 按 fail-closed 语义拒绝挂载（`GITEE_POLICY_UNAVAILABLE` /
#      `GITEE_ACTION_UNREGISTERED`，`missing` 列全），不降级成"无策略只读"。
#   2. `heluo-gitee`：`name` 必须是**包根名**（与清单 `name` 一致），写成子路径宿主解析不到该包。
#
# 目录（catalog）是 **6 条并集、0 条 write**：`change.read` / `change.list`（devops 的两条 dop 变更读）+
# 三条 `gitee.*` 只读 + 一条 `gitee.delivery.judge` 只读判定。
#   - 这一份并集**逐字**写在本包与 `@heluo/forge-devops` 的补丁层里，两行都叫
#     `id: heluo-policy`，都不另立服务域：loader 按 id 覆盖 config，同装后只剩一个 `policy`
#     实例、一份目录；任一插件单独装也能自洽。两处文本必须完全一致，否则幸存目录取决于
#     装配顺序（`tests/plugin-patch-layers.test.mjs` 静态守这份一致，`coexistence.test.mjs`
#     再验装配后果）。
#   - 第 5 条 `gitee.delivery.judge` 是"只判定、不执行"的只读能力，随包默认登记：
#     `kind: 'read'`（不建审批台账，见 @heluo/forge-policy 的 `needsApproval`）、
#     `target: 'change'`（逐字，非 `delivery` 等替代串）、`egress: 'allow'`（**必需**：门禁统一
#     以 `platform-write` 发起裁决，条目缺席 `egress` 时编译成默认 `confirm`，判定会永远拿不到
#     `done`）。判定回的 `executed` 恒为 `false`、`remote_calls` 恒为 `0`。
#   - 四个受控写（`gitee.issue.write` / `gitee.pr.write` / `gitee.review.publish` /
#     `gitee.review.record`）与远端写 `gitee.git.push` **不登记**，默认即 `denied`
#     （`rule: 'unregistered-action'`），且适配器与 `execFile` 出口都是 0 次调用——"没批准的
#     能力不出现"靠不登记实现，而不是靠运行时开关。本地动作 `git commit` 不进目录：它必须能做，
#     发起前由 `git-message.mjs` 强校验首行 `[变更号]`。
#   - 需要写能力时，由所属 profile 显式追加对应动作（写/确认类动作还需 `approvals` 台账条目，
#     见 @heluo/forge-policy 的 `assertEnabledEntriesApproved`）。默认分发层不替任何人预置授权。
#   - 审计舱用内存 sink：属**联调/试点级**证据，记录随进程退出丢失。生产或合规场景必须在
#     profile 注入持久 sink 后删掉 `allowNonDurable`（否则每个动作都会被 `POLICY_AUDIT_*` 拒绝）。
#   - 不写 `tools` 映射：插件的每个读/写都自己调 `policy.executeAction`，宿主工具层再映射一次
#     会重复准入、重复审计。
#
# 用法：dsh --profile web --patch <包内 cordis.patch.yml>
# 复核：dsh --profile web --patch <该文件> --dump-config | grep -A2 "id: heluo-"
# 门禁：packages/forge-gitee/test/entry.test.mjs 校验形状；patch-mount.test.mjs 用本文件的
# config 真实装配策略 + 插件（含空目录反向用例）；coexistence.test.mjs 覆盖单装/同装/并层。

- insert:
    - id: heluo-policy
      name: '@heluo/forge-policy'
      config:
        catalog:
          - { action: 'change.read', kind: 'read', target: 'change', enabled: true }
          - { action: 'change.list', kind: 'read', target: 'changes', enabled: true }
          - { action: 'gitee.repository.read', kind: 'read', target: 'repository', enabled: true }
          - { action: 'gitee.issue.read', kind: 'read', target: 'issue', enabled: true }
          - { action: 'gitee.pr.read', kind: 'read', target: 'pull-request', enabled: true }
          - { action: 'gitee.delivery.judge', kind: 'read', target: 'change', enabled: true, egress: 'allow' }
        audit:
          sink: memory
          allowNonDurable: true
    - id: heluo-gitee
      name: '@heluo/forge-gitee'
      # 显式空配置：宿主 resolveConfig 会把**缺席**的 `config:` 当 `undefined` 交给
      # `ConfigStandard.validate`，校验器一旦拒绝 undefined 整条 entry 就不激活（插件与 10 个
      # 工具一起消失，`--dump-config` 看不出来）。`config: {}` 让"零配置"是写下来的事实。
      # 五个可配键（cliPath / host / timeoutMs / authEnv / persistentToken）都可省略，
      # 默认值归 runtime-config；凭据默认只从环境变量取，缺失只提示不阻断。
      config: {}
