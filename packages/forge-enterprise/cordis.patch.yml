# @heluo/forge-enterprise 的基础补丁层（CORP-DSH-DESIGN-018 §3.2）。
#
# 本文件是包清单 `dsh.bundle.patch` 指向的默认层：只装**通用企业底座**——
# 官方行禁用（O3）、凭据加密存储、策略审计与 IAM。研发域成员（DevOps / Gitee /
# 交付 Skill 与「企业研发工具」UI 容器）一律不进本层，见同目录
# `cordis.patch.engineering.yml`；这样非研发用户的侧栏只有「企业账号」与「企业模型」。
#
# 命中不到的 id 会警告 `patch: entry "<id>" not found` 后跳过；`disabled: true` 由覆写层
# 给命中行加上，行本身仍出现在 dump 里（核验见 docs/design/plugins/forge-enterprise.md §5.1）。
#
# 用法：本层由 bundle 自动加载；研发组合再叠加 engineering 层：
#   dsh --profile web --patch <engineering.yml>
# 复核：dsh --profile web --dump-config | grep -A2 "id: heluo-"

# 官方登录与账户 UI：企业 IAM 是唯一登录（O3），不保留公网回落。
- id: deepseek-account
  disabled: true
- id: ui-settings-account
  disabled: true

# 官方模型两条路：账户登录模型与 API Key 模型。两者都关掉，
# `DEEPSEEK_API_KEY` 才不构成旁路（核验见 docs/design/plugins/forge-enterprise.md §5.1）。
- id: llm-deepseek-account
  disabled: true
- id: llm-deepseek
  disabled: true

# 企业模型由 IAM 内的受控适配器提供，关闭自由添加网关和独立 Key 的入口。
- id: llm-pi-ai
  disabled: true
- id: ui-settings-models
  disabled: true

# 官方本地凭据提供方（0600 明文 YAML）默认停用：企业凭据由下方凭据包管理。
# 只禁用、不删除该行——覆写层给命中行加 `disabled: true`，行本身仍出现在 dump 里。
# 该包使用值级加密 SQLite 和文件 keyring；保护边界与平台验证状态见包 README。
# 不得为了让组合起来而重新启用该行，也不得以本补丁存在证明凭据存储已具备生产资格。
- id: credentials
  disabled: true

# 通用企业底座的最小挂载。Cordis Loader 并发创建条目，行序不构成加载顺序语义；
# 凭据、策略与 IAM 的先后由各自的依赖注入决定，不靠本文件的排列保证。
# 策略行携带与 devops / gitee 两个补丁层**逐字相同**的 6 条并集目录与内存审计：同
# id 时 loader 按 id 覆盖 config，只留一个策略实例，装配顺序不影响幸存配置（D-5）。
# 内存审计舱属联调/试点级证据；生产或合规场景必须注入持久 sink 并去掉 allowNonDurable。
# 其余行只给最小配置；缺配置时按包自己的 fail-closed 语义拒绝，不在补丁里塞默认凭据。
- insert:
    - id: heluo-credentials-keychain
      name: '@heluo/forge-credentials-keychain'
    - id: heluo-policy
      name: '@heluo/forge-policy'
      config:
        catalog:
          - { action: 'change.read', kind: 'read', target: 'change', enabled: true }
          - { action: 'change.list', kind: 'read', target: 'changes', enabled: true }
          - { action: 'gitee.repository.read', kind: 'read', target: 'repository', enabled: true }
          - { action: 'gitee.issue.read', kind: 'read', target: 'issue', enabled: true }
          - { action: 'gitee.pr.read', kind: 'read', target: 'pull-request', enabled: true }
          - { action: 'gitee.delivery.judge', kind: 'read', target: 'change', enabled: true, egress: 'allow' }
        audit:
          sink: memory
          allowNonDurable: true
    - id: heluo-iam
      name: '@heluo/forge-iam'