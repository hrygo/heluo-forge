# @heluo/forge-enterprise 的企业组合补丁层。
#
# 本文件承载两件事：
#   1. O3 要求的"官方行默认禁用"（实测：`dsh --patch` 的覆写层会给命中行加上
#      `disabled: true`；命中不到的 id 会警告 `patch: entry "<id>" not found` 后跳过）。
#   2. 企业组合的最小挂载：`insert:` 段把三个有真实 Host 职责的企业插件挂进 profile；SDD 仅作为库/CLI 随制品交付。
#      历史市场包 `@heluo/forge-market` 按设计不挂（它不属于轻量原生索引模式的目标）。
#
# 插入行的范围以"包已有清单、源码与测试"为准；网关、Gitee、品牌仍只有 README
#（DevOps 已落地只读查询 + 门禁骨架，企业 CLI 未联调），不预建指向未实现包的入口。
#
# 用法：dsh --profile web --patch <该文件>
# 复核：dsh --profile web --patch <该文件> --dump-config | grep -A2 "id: heluo-"

# 官方登录与账户 UI：企业 IAM 是唯一登录（O3），不保留公网回落。
- id: deepseek-account
  disabled: true
- id: ui-settings-account
  disabled: true

# 官方模型两条路：账户登录模型与 API Key 模型。两者都关掉，
# `DEEPSEEK_API_KEY` 才不构成旁路（核验见 docs/design/plugins/forge-enterprise.md §5.1）。
- id: llm-deepseek-account
  disabled: true
- id: llm-deepseek
  disabled: true

# 官方本地凭据提供方（0600 明文 YAML）默认停用：企业凭据只允许进系统钥匙串。
# 只禁用、不删除该行——覆写层给命中行加 `disabled: true`，行本身仍出现在 dump 里。
# 停用后由下方 insert 的 heluo-credentials-keychain 兜底；该包的 @napi-rs/keyring
# 原生后端仍是未审核样机，原生不可用时的行为以包 README 为准。不得为了让组合起来而
# 重新启用该行，也不得以本补丁存在证明凭据存储已具备生产资格。
- id: credentials
  disabled: true

# 企业组合的最小挂载。Cordis Loader 并发创建条目，行序不构成加载顺序语义；
# 凭据、策略与 IAM 的先后由各自的依赖注入决定，不靠本文件的排列保证。
# 策略行携带与 devops / gitee 两个补丁层**逐字相同**的 6 条并集目录与内存审计：三层同
# id 时 loader 按 id 覆盖 config，只留一个策略实例，装配顺序不影响幸存配置（D-5）。
# 内存审计舱属联调/试点级证据；生产或合规场景必须注入持久 sink 并去掉 allowNonDurable。
# 其余行只给最小配置；缺配置时按包自己的 fail-closed 语义拒绝，不在补丁里塞默认凭据。
- insert:
    - id: heluo-credentials-keychain
      name: '@heluo/forge-credentials-keychain'
    - id: heluo-policy
      name: '@heluo/forge-policy'
      config:
        catalog:
          - { action: 'change.read', kind: 'read', target: 'change', enabled: true }
          - { action: 'change.list', kind: 'read', target: 'changes', enabled: true }
          - { action: 'gitee.repository.read', kind: 'read', target: 'repository', enabled: true }
          - { action: 'gitee.issue.read', kind: 'read', target: 'issue', enabled: true }
          - { action: 'gitee.pr.read', kind: 'read', target: 'pull-request', enabled: true }
          - { action: 'gitee.delivery.judge', kind: 'read', target: 'change', enabled: true, egress: 'allow' }
        audit:
          sink: memory
          allowNonDurable: true
    - id: heluo-iam
      name: '@heluo/forge-iam'
