# @heluo/forge-enterprise 的基础补丁层（CORP-DSH-DESIGN-004）。
#
# 本包是面向全体企业成员的「企业账号与模型」通用底座：只负责官方账号/模型/明文凭据七行停用（O3）、
# 系统钥匙串加密凭据存储、共享策略目录与企业 IAM（含 AI 网关与模型目录管理）。
# 研发工作台、DevOps（DOP）、Gitee 与交付规范等研发扩展能力已拆分为独立预装包
# `@heluo/forge-engineering`（CORP-DSH-DESIGN-019），互不强耦合。
#
# 命中不到的 id 会警告 `patch: entry "<id>" not found` 后跳过；`disabled: true` 由覆写层
# 给命中行加上，行本身仍出现在 dump 里（核验见 docs/design/plugins/forge-enterprise.md §5.1）。
#
# 复核：dsh --profile web --dump-config | grep -A2 "id: heluo-"

# 官方登录与账户 UI：企业 IAM 是唯一登录（O3），不保留公网回落。
- id: deepseek-account
  disabled: true
- id: ui-settings-account
  disabled: true

# 官方模型两条路：账户登录模型与 API Key 模型。两者都关掉，
# `DEEPSEEK_API_KEY` 才不构成旁路（核验见 docs/design/plugins/forge-enterprise.md §5.1）。
- id: llm-deepseek-account
  disabled: true
- id: llm-deepseek
  disabled: true

# 企业模型由 IAM 内的受控适配器提供，关闭自由添加网关和独立 Key 的入口。
- id: llm-pi-ai
  disabled: true
- id: ui-settings-models
  disabled: true

# 官方本地凭据提供方（0600 明文 YAML）默认停用：企业凭据由下方凭据包管理。
# 只禁用、不删除该行——覆写层给命中行加 `disabled: true`，行本身仍出现在 dump 里。
# 该包使用值级加密 SQLite 和文件 keyring；保护边界与平台验证状态见包 README。
# 不得为了让组合起来而重新启用该行，也不得以本补丁存在证明凭据存储已具备生产资格。
- id: credentials
  disabled: true

# 权限档位：宿主审批服务是 Gitee / DevOps 受控写动作（C3 分类待批待验）唯一的确认通道。
# `approval: never` 在分发前就按 fail-closed 确定性拒绝，确认卡片永远不会到达用户，
# 因此本层不提供任何 `never` 档位：三档都必须保留人工确认，新会话默认 workspace-write。
# 组合包层先于 profile 层应用；确需静默的无人值守部署在 profile 的 dsh-user-approval 行
# 显式声明 `policy: never` 并接受写动作被拒绝，而不是把档位改成 never。
# `name` 必须与基础组合里的 permission 行一致，否则补丁按 name 不匹配告警后跳过。
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: ask
    defaultPreset: workspace-write

# 通用企业底座挂载。策略行携带与 `@heluo/forge-engineering` 及其成员包逐字一致的 12 条动作目录
# （6 读 + 6 写）与内存审计配置（无 isolate）；与 `@heluo/forge-engineering` 并存安装时由 Cordis
# Loader 按 id 合并为单一策略实例，不依赖挂载顺序。
# 内存审计舱属联调/试点级证据；生产或合规场景必须注入持久 sink 并去掉 allowNonDurable。
- insert:
    - id: heluo-credentials-keychain
      name: '@heluo/forge-credentials-keychain'
    - id: heluo-policy
      name: '@heluo/forge-policy'
      config:
        catalog:
          - { action: 'change.read', target: 'change', enabled: true }
          - { action: 'change.list', target: 'changes', enabled: true }
          - { action: 'gitee.repository.read', target: 'repository', enabled: true }
          - { action: 'gitee.issue.read', target: 'issue', enabled: true }
          - { action: 'gitee.pr.read', target: 'pull-request', enabled: true }
          - { action: 'gitee.delivery.judge', target: 'change', enabled: true }
          - { action: 'gitee.issue.write', target: 'issue', enabled: true }
          - { action: 'gitee.pr.write', target: 'pull-request', enabled: true }
          - { action: 'change.clarification.write', target: 'change', enabled: true }
          - { action: 'gitee.review.publish', target: 'pull-request', enabled: true }
          - { action: 'gitee.git.push', target: 'repository', enabled: true }
          - { action: 'gitee.review.record', target: 'pull-request', enabled: true }
        audit:
          sink: memory
          allowNonDurable: true
    - id: heluo-iam
      name: '@heluo/forge-iam'
